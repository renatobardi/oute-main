# SonarQube Project Configuration
# Quality gates enforcement for oute-main

# Project identification
sonar.projectKey=oute-mind
sonar.projectName=Oute Main - Quality Gates
sonar.projectVersion=1.0.0

# Source code
sonar.sources=packages,shared
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts,**/dist/**,**/build/**,.next/**,coverage/**

# Test files
sonar.tests=packages,shared
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.coverage.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts,**/dist/**,**/build/**

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language settings
sonar.language=ts

# Quality gates
# These are enforced by SonarQube server configuration
# Minimum requirement: A- grade (or equivalent metrics)

# Code smells: max 30% of duplicated lines
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts

# Type checking
sonar.typescript.node.libs=true
sonar.typescript.tsconfigPath=tsconfig.json

# Issues
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts

sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S101
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.ts
