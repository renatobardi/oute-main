name: Deploy oute-main to oute-mind VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VM_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOSTNAME }} "echo 'SSH OK'"

      - name: Deploy to VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOSTNAME }} << 'EOFVM'
            # Pull latest oute-main (source for SvelteKit services)
            cd ~/oute-main
            git pull origin main

            # Pull latest oute-mind (docker-compose lives here)
            cd ~/oute-mind
            git pull origin main

            # Ensure .env is linked
            ln -sf .env.production .env

            # Build and restart all oute-main services + caddy
            docker compose build 00_dashboard 01_auth-profile 02_projects 99_home 03_interview
            docker compose up -d 00_dashboard 01_auth-profile 02_projects 99_home 03_interview
            docker compose restart caddy
          EOFVM

      - name: Health checks (via SSH + docker exec)
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOSTNAME }} << 'EOFVM'
            for svc in "Dashboard:oute-dashboard:3000:/dashboard/health" "Auth:oute-auth-profile:3001:/health" "Projects:oute-projects:3002:/health" "Home:oute-home:3003:/health" "Interview:oute-interview:3002:/chat/health"; do
              name=$(echo "$svc" | cut -d: -f1)
              container=$(echo "$svc" | cut -d: -f2)
              port=$(echo "$svc" | cut -d: -f3)
              path=$(echo "$svc" | cut -d: -f4)
              for i in $(seq 1 20); do
                if docker exec "$container" wget -qO- "http://127.0.0.1:${port}${path}" > /dev/null 2>&1; then
                  echo "✅ ${name} health check PASSED (container ${container})"
                  break
                fi
                if [ "$i" -eq 20 ]; then
                  echo "❌ ${name} health check FAILED after 20 attempts"
                  exit 1
                fi
                echo "  ${name} attempt ${i}/20, retrying in 3s..."
                sleep 3
              done
            done
          EOFVM

      - name: Deployment success
        if: success()
        run: |
          echo "✅ Deployment to VM successful!"
          echo "Services deployed:"
          echo "  Landing Page: http://${{ secrets.VM_HOSTNAME }}/"
          echo "  Dashboard:    http://${{ secrets.VM_HOSTNAME }}/dashboard"
          echo "  Chat:         http://${{ secrets.VM_HOSTNAME }}/chat"
          echo "  Auth API:     http://${{ secrets.VM_HOSTNAME }}/api/auth"
          echo "  Projects:     http://${{ secrets.VM_HOSTNAME }}/api/projects"
          echo "  FastAPI:      http://${{ secrets.VM_HOSTNAME }}/health"

      - name: Capture logs on failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED — capturing container logs..."
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOSTNAME }} << 'EOFVM'
            cd ~/oute-mind
            echo "=== Container Status ==="
            docker compose ps
            echo "=== Dashboard Logs ==="
            docker compose logs --tail=30 00_dashboard 2>&1 || true
            echo "=== Auth Logs ==="
            docker compose logs --tail=30 01_auth-profile 2>&1 || true
            echo "=== Projects Logs ==="
            docker compose logs --tail=30 02_projects 2>&1 || true
            echo "=== Home Logs ==="
            docker compose logs --tail=30 99_home 2>&1 || true
            echo "=== Interview Logs ==="
            docker compose logs --tail=30 03_interview 2>&1 || true
          EOFVM
