name: Deploy oute-main to oute-mind VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: oute-mind

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: oute-mind

      - name: Deploy to VM
        run: |
          gcloud compute ssh oute-mind \
            --zone=us-central1-a \
            --project=oute-mind \
            --tunnel-through-iap \
            --command='
              set -e
              sudo bash -c "
                cd /home/ubuntu/oute-main && git pull origin main
                cd /home/ubuntu/oute-mind && git pull origin main
                ln -sf .env.production .env
                docker compose build 00_dashboard 01_auth-profile 02_projects 99_home 03_interview
                docker compose up -d 00_dashboard 01_auth-profile 02_projects 99_home 03_interview
                docker compose restart caddy
              "
            '

      - name: Health checks
        run: |
          gcloud compute ssh oute-mind \
            --zone=us-central1-a \
            --project=oute-mind \
            --tunnel-through-iap \
            --command='
              sudo bash -c "
                for svc in \"Dashboard:oute-dashboard:3000:/dashboard/health\" \"Auth:oute-auth-profile:3001:/health\" \"Projects:oute-projects:3002:/health\" \"Home:oute-home:3003:/health\" \"Interview:oute-interview:3002:/chat/health\"; do
                  name=\$(echo \"\$svc\" | cut -d: -f1)
                  container=\$(echo \"\$svc\" | cut -d: -f2)
                  port=\$(echo \"\$svc\" | cut -d: -f3)
                  path=\$(echo \"\$svc\" | cut -d: -f4)
                  for i in \$(seq 1 20); do
                    if docker exec \"\$container\" wget -qO- \"http://127.0.0.1:\${port}\${path}\" > /dev/null 2>&1; then
                      echo \"✅ \${name} health check PASSED (container \${container})\"
                      break
                    fi
                    if [ \"\$i\" -eq 20 ]; then
                      echo \"❌ \${name} health check FAILED after 20 attempts\"
                      exit 1
                    fi
                    echo \"  \${name} attempt \${i}/20, retrying in 3s...\"
                    sleep 3
                  done
                done
              "
            '

      - name: Deployment success
        if: success()
        run: |
          echo "✅ Deployment to VM successful!"
          echo "Services deployed:"
          echo "  Landing Page: https://oute.app/"
          echo "  Dashboard:    https://oute.app/dashboard"
          echo "  Chat:         https://oute.app/chat"
          echo "  Auth API:     https://oute.app/api/auth"
          echo "  Projects:     https://oute.app/api/projects"

      - name: Capture logs on failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED — capturing container logs..."
          gcloud compute ssh oute-mind \
            --zone=us-central1-a \
            --project=oute-mind \
            --tunnel-through-iap \
            --command='
              sudo bash -c "
                cd /home/ubuntu/oute-mind
                echo === Container Status ===
                docker compose ps
                echo === Dashboard Logs ===
                docker compose logs --tail=30 00_dashboard 2>&1 || true
                echo === Auth Logs ===
                docker compose logs --tail=30 01_auth-profile 2>&1 || true
                echo === Projects Logs ===
                docker compose logs --tail=30 02_projects 2>&1 || true
                echo === Home Logs ===
                docker compose logs --tail=30 99_home 2>&1 || true
                echo === Interview Logs ===
                docker compose logs --tail=30 03_interview 2>&1 || true
              "
            ' || echo "Could not connect to VM for log capture"
