name: Deploy oute-main to oute-mind VM

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VM_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOSTNAME }} "echo 'SSH OK'"

      - name: Deploy to VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOSTNAME }} << 'EOFVM'
            cd ~/oute-mind

            # Pull latest changes
            git pull origin main

            # Build and restart services (native arm64, no cross-compile)
            docker compose build 00_dashboard 01_auth-profile 02_projects
            docker compose up -d 00_dashboard 01_auth-profile 02_projects
          EOFVM

      - name: Health check - Dashboard
        run: |
          for i in {1..30}; do
            if curl -sf http://${{ secrets.VM_HOSTNAME }}:3000/health; then
              echo "Dashboard health check PASSED"
              exit 0
            fi
            echo "Health check attempt $i/30, retrying in 2s..."
            sleep 2
          done
          echo "Dashboard health check FAILED after 30 attempts"
          exit 1

      - name: Health check - Auth API
        run: |
          for i in {1..30}; do
            if curl -sf http://${{ secrets.VM_HOSTNAME }}:3001/health; then
              echo "Auth API health check PASSED"
              exit 0
            fi
            echo "Health check attempt $i/30, retrying in 2s..."
            sleep 2
          done
          echo "Auth API health check FAILED after 30 attempts"
          exit 1

      - name: Health check - Projects API
        run: |
          for i in {1..30}; do
            if curl -sf http://${{ secrets.VM_HOSTNAME }}:3002/health; then
              echo "Projects API health check PASSED"
              exit 0
            fi
            echo "Health check attempt $i/30, retrying in 2s..."
            sleep 2
          done
          echo "Projects API health check FAILED after 30 attempts"
          exit 1

      - name: Verify Caddy reverse proxy routing
        continue-on-error: true
        run: |
          echo "Verifying Caddy routing for oute-main services..."
          curl -sf http://${{ secrets.VM_HOSTNAME }}/dashboard/health && echo "Dashboard Caddy OK" || echo "Dashboard Caddy not configured"
          curl -sf http://${{ secrets.VM_HOSTNAME }}/api/auth/health && echo "Auth Caddy OK" || echo "Auth Caddy not configured"
          curl -sf http://${{ secrets.VM_HOSTNAME }}/api/projects/health && echo "Projects Caddy OK" || echo "Projects Caddy not configured"

      - name: Deployment success
        if: success()
        run: |
          echo "✅ Deployment to VM successful!"
          echo "Services:"
          echo "  Dashboard: http://${{ secrets.VM_HOSTNAME }}:3000"
          echo "  Auth API:  http://${{ secrets.VM_HOSTNAME }}:3001"
          echo "  Projects:  http://${{ secrets.VM_HOSTNAME }}:3002"

      - name: Capture logs on failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED — capturing container logs..."
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOSTNAME }} << 'EOFVM'
            cd ~/oute-mind
            echo "=== Container Status ==="
            docker compose ps
            echo "=== Dashboard Logs ==="
            docker compose logs --tail=30 00_dashboard 2>&1 || true
            echo "=== Auth Logs ==="
            docker compose logs --tail=30 01_auth-profile 2>&1 || true
            echo "=== Projects Logs ==="
            docker compose logs --tail=30 02_projects 2>&1 || true
          EOFVM
