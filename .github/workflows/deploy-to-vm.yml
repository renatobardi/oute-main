name: Deploy oute-main to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: oute-mind

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: oute-mind

      - name: Deploy to VM
        run: |
          # Detect zone from running instance
          ZONE=$(gcloud compute instances list --filter="name:oute-mind" --format="value(zone)" --project=oute-mind | head -1)
          echo "Deploying to zone: $ZONE"
          gcloud compute ssh oute-mind \
            --zone=$ZONE \
            --project=oute-mind \
            --tunnel-through-iap \
            --command='
              set -e
              sudo bash -c "
                # Install docker compose v2 plugin if missing
                if ! docker compose version &>/dev/null; then
                  echo \"Installing docker compose v2 plugin...\"
                  mkdir -p /usr/local/lib/docker/cli-plugins
                  ARCH=\$(uname -m)
                  if [ \"\$ARCH\" = \"aarch64\" ]; then ARCH=aarch64; fi
                  curl -fsSL \"https://github.com/docker/compose/releases/latest/download/docker-compose-linux-\$ARCH\" -o /usr/local/lib/docker/cli-plugins/docker-compose
                  chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
                fi
                echo \"Using: \$(docker compose version)\"

                OUTE_MAIN=\$(find /home -maxdepth 2 -name oute-main -type d 2>/dev/null | head -1)
                echo \"Found oute-main at: \$OUTE_MAIN\"

                git config --global --add safe.directory \$OUTE_MAIN

                cd \$OUTE_MAIN
                git pull origin main
                ln -sf .env.production .env

                # Clean package caches to force fresh build
                echo \"=== Cleaning build caches ===\"
                for pkg in packages/*/; do
                  rm -rf \"\${pkg}node_modules\" \"\${pkg}build\" \"\${pkg}.svelte-kit\" 2>/dev/null || true
                done

                # Remove old oute-main images
                echo \"=== Removing old images ===\"
                docker compose -f docker-compose.prod.yml down 2>/dev/null || true
                docker rmi oute-dashboard oute-auth-profile oute-projects oute-home oute-interview oute-oops 2>/dev/null || true
                docker image prune -f

                # Build and start
                echo \"=== Building images ===\"
                docker compose -f docker-compose.prod.yml build --no-cache --pull
                docker compose -f docker-compose.prod.yml up -d
                echo \"Containers started successfully\"
              "
            '

      - name: Health checks
        run: |
          ZONE=$(gcloud compute instances list --filter="name:oute-mind" --format="value(zone)" --project=oute-mind | head -1)
          gcloud compute ssh oute-mind \
            --zone=$ZONE \
            --project=oute-mind \
            --tunnel-through-iap \
            --command='
              sudo bash -c "
                FAILED=0
                # Format: name:container:port:path
                for svc in \"Dashboard:oute-dashboard:3000:/dashboard/health\" \"Auth:oute-auth-profile:3001:/auth/health\" \"Projects:oute-projects:3002:/projects/health\" \"Home:oute-home:3003:/health\" \"Interview:oute-interview:3002:/chat/health\" \"Oops:oute-oops:3004:/health\"; do
                  name=\$(echo \"\$svc\" | cut -d: -f1)
                  container=\$(echo \"\$svc\" | cut -d: -f2)
                  port=\$(echo \"\$svc\" | cut -d: -f3)
                  path=\$(echo \"\$svc\" | cut -d: -f4)
                  OK=0
                  for i in \$(seq 1 20); do
                    # Try with wget or curl inside container
                    if docker exec \"\$container\" sh -c \"wget -qO- http://127.0.0.1:\${port}\${path} || curl -s http://127.0.0.1:\${port}\${path}\" > /dev/null 2>&1; then
                      echo \"\${name} health check PASSED\"
                      OK=1
                      break
                    fi
                    echo \"  \${name} attempt \${i}/20...\"
                    sleep 3
                  done
                  if [ \"\$OK\" -eq 0 ]; then
                    echo \"\${name} health check FAILED (tried 20 times, 60s total)\"
                    FAILED=\$((FAILED+1))
                  fi
                done
                if [ \"\$FAILED\" -gt 2 ]; then
                  echo \"Too many health checks failed (\$FAILED/6) — aborting\"
                  exit 1
                fi
                echo \"Health checks: \$((6-FAILED))/6 passed\"
              "
            '

      - name: Deployment success
        if: success()
        run: |
          VM_IP=$(gcloud compute addresses describe oute-mind-ip \
            --region=us-central1 --project=oute-mind --format="get(address)")
          echo "oute-main deployed successfully!"
          echo "  Landing:   http://${VM_IP}/"
          echo "  Dashboard: http://${VM_IP}/dashboard"
          echo "  Chat:      http://${VM_IP}/chat"
          echo "  Auth API:  http://${VM_IP}/api/auth"
          echo "  Projects:  http://${VM_IP}/api/projects"

      - name: Capture logs on failure
        if: failure()
        run: |
          ZONE=$(gcloud compute instances list --filter="name:oute-mind" --format="value(zone)" --project=oute-mind | head -1)
          gcloud compute ssh oute-mind \
            --zone=$ZONE \
            --project=oute-mind \
            --tunnel-through-iap \
            --command='
              sudo bash -c "
                OUTE_MAIN=\$(find /home -maxdepth 2 -name oute-main -type d 2>/dev/null | head -1)
                cd \$OUTE_MAIN 2>/dev/null || true
                echo === Container Status ===
                docker compose -f docker-compose.prod.yml ps
                for svc in 00_dashboard 01_auth-profile 02_projects 03_interview 99_home 98_oops; do
                  echo === \$svc Logs ===
                  docker compose -f docker-compose.prod.yml logs --tail=30 \$svc 2>&1 || true
                done
              "
            ' || echo "Could not connect to VM for log capture"
