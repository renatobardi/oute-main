name: Deploy oute-main to oute-mind VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: oute-mind

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: oute-mind

      - name: Deploy to VM
        run: |
          # Detect zone from running instance
          ZONE=$(gcloud compute instances list --filter="name:oute-mind" --format="value(zone)" --project=oute-mind | head -1)
          echo "Deploying to zone: $ZONE"
          gcloud compute ssh oute-mind \
            --zone=$ZONE \
            --project=oute-mind \
            --tunnel-through-iap \
            --command='
              set -e
              sudo bash -c "
                # Install docker compose v2 plugin if missing
                if ! docker compose version &>/dev/null; then
                  echo \"Installing docker compose v2 plugin...\"
                  mkdir -p /usr/local/lib/docker/cli-plugins
                  ARCH=\$(uname -m)
                  if [ \"\$ARCH\" = \"aarch64\" ]; then ARCH=aarch64; fi
                  curl -fsSL \"https://github.com/docker/compose/releases/latest/download/docker-compose-linux-\$ARCH\" -o /usr/local/lib/docker/cli-plugins/docker-compose
                  chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
                fi
                echo \"Using: \$(docker compose version)\"

                OUTE_HOME=\$(find /home -maxdepth 2 -name oute-mind -type d 2>/dev/null | head -1 | xargs dirname)
                echo \"Found oute home at: \$OUTE_HOME\"

                # Fix git dubious ownership issue
                git config --global --add safe.directory \$OUTE_HOME/oute-main
                git config --global --add safe.directory \$OUTE_HOME/oute-mind

                cd \$OUTE_HOME/oute-main && git pull origin main
                cd \$OUTE_HOME/oute-mind && git pull origin main
                ln -sf .env.production .env

                # Verify new code is present before building
                echo \"=== Verifying source code ===\"
                echo \"Git status (oute-main):\"
                cd \$OUTE_HOME/oute-main && git log -1 --oneline
                echo \"SearchInput.svelte content (first 10 lines):\"
                head -10 packages/99_home/src/lib/components/SearchInput.svelte

                # Aggressive cache cleanup
                echo \"=== Cleaning all caches ===\"
                cd \$OUTE_HOME/oute-main
                for pkg in packages/*/; do
                  rm -rf \"\${pkg}node_modules\" \"\${pkg}build\" \"\${pkg}.svelte-kit\" 2>/dev/null || true
                done
                rm -rf \$OUTE_HOME/oute-main/.npm 2>/dev/null || true
                echo \"Cache cleanup completed\"

                # Remove old Docker images to force complete rebuild
                echo \"=== Removing old Docker images ===\"
                docker compose -f \$OUTE_HOME/oute-mind/docker-compose.yml down -v 2>/dev/null || true
                docker rmi oute-dashboard oute-auth-profile oute-projects oute-home oute-interview oute-oops 2>/dev/null || true
                docker system prune -f --all

                # Build with explicit no-cache and fresh layers (with retry logic)
                echo \"=== Building Docker images ===\"
                cd \$OUTE_HOME/oute-mind

                BUILD_RETRY=0
                BUILD_MAX_RETRIES=3
                BUILD_SUCCESS=0

                while [ \$BUILD_RETRY -lt \$BUILD_MAX_RETRIES ] && [ \$BUILD_SUCCESS -eq 0 ]; do
                  echo \"Build attempt \$((BUILD_RETRY+1))/\$BUILD_MAX_RETRIES\"
                  if docker compose build --no-cache --pull; then
                    BUILD_SUCCESS=1
                    echo \"Docker images built successfully\"
                  else
                    BUILD_RETRY=\$((BUILD_RETRY+1))
                    if [ \$BUILD_RETRY -lt \$BUILD_MAX_RETRIES ]; then
                      echo \"Build failed, waiting 30s before retry...\"
                      sleep 30
                    fi
                  fi
                done

                if [ \$BUILD_SUCCESS -eq 0 ]; then
                  echo \"Failed to build Docker images after \$BUILD_MAX_RETRIES attempts\"
                  exit 1
                fi

                docker compose up -d
                docker compose restart caddy
                echo \"Containers started successfully\"
              "
            '

      - name: Health checks
        run: |
          ZONE=$(gcloud compute instances list --filter="name:oute-mind" --format="value(zone)" --project=oute-mind | head -1)
          gcloud compute ssh oute-mind \
            --zone=$ZONE \
            --project=oute-mind \
            --tunnel-through-iap \
            --command='
              sudo bash -c "
                FAILED=0
                # Format: name:container:port:path
                for svc in \"Dashboard:oute-dashboard:3000:/dashboard/health\" \"Auth:oute-auth-profile:3001:/auth/health\" \"Projects:oute-projects:3002:/projects/health\" \"Home:oute-home:3003:/health\" \"Interview:oute-interview:3002:/chat/health\" \"Oops:oute-oops:3004:/health\"; do
                  name=\$(echo \"\$svc\" | cut -d: -f1)
                  container=\$(echo \"\$svc\" | cut -d: -f2)
                  port=\$(echo \"\$svc\" | cut -d: -f3)
                  path=\$(echo \"\$svc\" | cut -d: -f4)
                  OK=0
                  for i in \$(seq 1 20); do
                    # Try with wget or curl inside container
                    if docker exec \"\$container\" sh -c \"wget -qO- http://127.0.0.1:\${port}\${path} || curl -s http://127.0.0.1:\${port}\${path}\" > /dev/null 2>&1; then
                      echo \"\${name} health check PASSED\"
                      OK=1
                      break
                    fi
                    echo \"  \${name} attempt \${i}/20...\"
                    sleep 3
                  done
                  if [ \"\$OK\" -eq 0 ]; then
                    echo \"\${name} health check FAILED (tried 20 times, 60s total)\"
                    FAILED=\$((FAILED+1))
                  fi
                done
                if [ \"\$FAILED\" -gt 2 ]; then
                  echo \"Too many health checks failed (\$FAILED/6) - aborting deployment\"
                  exit 1
                fi
                echo \"Health checks completed: \$((6-FAILED))/6 passed\"
              "
            '

      - name: Deployment success
        if: success()
        run: |
          echo "Deployment to VM successful!"
          echo "Services deployed:"
          echo "  Landing Page: http://34.132.93.171/"
          echo "  Dashboard:    http://34.132.93.171/dashboard"
          echo "  Chat:         http://34.132.93.171/chat"
          echo "  Auth API:     http://34.132.93.171/api/auth"
          echo "  Projects:     http://34.132.93.171/api/projects"
          echo "  404 Oops:     http://34.132.93.171/<rota-invalida>"

      - name: Capture logs on failure
        if: failure()
        run: |
          echo "Deployment FAILED - capturing container logs..."
          ZONE=$(gcloud compute instances list --filter="name:oute-mind" --format="value(zone)" --project=oute-mind | head -1)
          gcloud compute ssh oute-mind \
            --zone=$ZONE \
            --project=oute-mind \
            --tunnel-through-iap \
            --command='
              sudo bash -c "
                OUTE_HOME=\$(find /home -maxdepth 2 -name oute-mind -type d 2>/dev/null | head -1 | xargs dirname)
                cd \$OUTE_HOME/oute-mind 2>/dev/null || true
                echo === Container Status ===
                docker compose ps
                for svc in 00_dashboard 01_auth-profile 02_projects 99_home 03_interview 98_oops; do
                  echo === \$svc Logs ===
                  docker compose logs --tail=30 \$svc 2>&1 || true
                done
              "
            ' || echo "Could not connect to VM for log capture"
