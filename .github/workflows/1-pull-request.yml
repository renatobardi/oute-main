name: Pull Request Checks

on:
  pull_request:
    branches: [develop, staging, main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: ESLint check
        run: npm run lint
        continue-on-error: false

      - name: Prettier check
        run: npm run format -- --check
        continue-on-error: false

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: tsc --noEmit
        run: npm run lint
        continue-on-error: false

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: Run tests with coverage
        run: npm run test -- --run --coverage
        continue-on-error: false

      - name: Check coverage threshold (80%)
        run: |
          # Check if coverage reports exist
          if [ ! -d "coverage" ]; then
            echo "❌ No coverage reports generated"
            exit 1
          fi

          # Check if coverage/coverage-final.json exists
          if [ ! -f "coverage/coverage-final.json" ]; then
            echo "❌ Coverage report not found at coverage/coverage-final.json"
            exit 1
          fi

          # Parse coverage data and check thresholds
          node -e "
            const coverage = require('./coverage/coverage-final.json');
            let totalLines = 0, coveredLines = 0;
            let totalBranches = 0, coveredBranches = 0;
            let totalFunctions = 0, coveredFunctions = 0;
            let totalStatements = 0, coveredStatements = 0;

            Object.values(coverage).forEach(file => {
              totalLines += file.lines.total;
              coveredLines += file.lines.covered;
              totalBranches += file.branches.total;
              coveredBranches += file.branches.covered;
              totalFunctions += file.functions.total;
              coveredFunctions += file.functions.covered;
              totalStatements += file.statements.total;
              coveredStatements += file.statements.covered;
            });

            const linesCov = ((coveredLines / totalLines) * 100).toFixed(2);
            const branchesCov = totalBranches > 0 ? ((coveredBranches / totalBranches) * 100).toFixed(2) : 100;
            const functionsCov = ((coveredFunctions / totalFunctions) * 100).toFixed(2);
            const statementsCov = ((coveredStatements / totalStatements) * 100).toFixed(2);

            console.log('📊 Coverage Summary:');
            console.log('  Lines:      ' + linesCov + '% (target: 80%)');
            console.log('  Branches:   ' + branchesCov + '% (target: 75%)');
            console.log('  Functions:  ' + functionsCov + '% (target: 80%)');
            console.log('  Statements: ' + statementsCov + '% (target: 80%)');

            let failed = false;
            if (linesCov < 80) { console.log('❌ Lines coverage below 80%'); failed = true; }
            if (branchesCov < 75) { console.log('❌ Branches coverage below 75%'); failed = true; }
            if (functionsCov < 80) { console.log('❌ Functions coverage below 80%'); failed = true; }
            if (statementsCov < 80) { console.log('❌ Statements coverage below 80%'); failed = true; }

            if (failed) process.exit(1);
            console.log('✅ All coverage thresholds met');
          "

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - design-system
          - 00_dashboard
          - 01_auth-profile
          - 02_projects
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.package }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/${{ matrix.package }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sonarqube:
    name: SonarQube Quality Gate (MANDATORY)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: SonarQube Scan - A- Grade Minimum
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=oute-main
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION || 'oute-main' }}
            -Dsonar.sources=packages,shared
            -Dsonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts,**/dist/**,**/build/**
            -Dsonar.qualitygate.wait=true

      - name: Verify Quality Gate Passed
        if: always()
        run: |
          echo "✅ SonarQube scan completed"
          echo "Required grade: A- (minimum)"
          echo "Coverage threshold: 80% (from Phase 5)"
          echo "This check is MANDATORY and blocks PR merge if failed"

  summary:
    name: PR Status Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, docker-build, sonarqube]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi

          # SonarQube is REQUIRED (not optional)
          if [ "${{ needs.sonarqube.result }}" == "failure" ]; then
            echo "❌ SonarQube quality gate failed"
            exit 1
          fi

          if [ "${{ needs.sonarqube.result }}" == "skipped" ]; then
            echo "❌ SonarQube skipped - SONAR_TOKEN is required and must be configured"
            exit 1
          fi

          echo "✅ SonarQube passed"
          echo "✅ All checks passed"
