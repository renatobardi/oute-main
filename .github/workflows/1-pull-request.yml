name: Pull Request Checks

on:
  pull_request:
    branches: [develop, staging, main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: ESLint check
        run: npm run lint
        continue-on-error: false

      - name: Prettier check
        run: npm run format -- --check
        continue-on-error: false

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: TypeScript check per workspace
        run: |
          for dir in packages/design-system packages/00_dashboard packages/01_auth-profile packages/02_projects; do
            if [ -f "$dir/tsconfig.json" ]; then
              echo "Checking $dir..."
              npx tsc --noEmit --project "$dir/tsconfig.json" || true
            fi
          done
        continue-on-error: false

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: Run tests with coverage per package
        run: |
          for dir in packages/design-system packages/00_dashboard packages/01_auth-profile packages/02_projects; do
            if [ -f "$dir/vitest.config.ts" ]; then
              echo "🧪 Running tests in $dir..."
              npx vitest run --coverage --root "$dir" || exit 1
            fi
          done

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          for dir in packages/design-system packages/00_dashboard packages/01_auth-profile packages/02_projects; do
            if [ -f "$dir/coverage/lcov.info" ]; then
              echo "📊 Found coverage in $dir"
              cat "$dir/coverage/lcov.info" >> coverage/lcov.info
            fi
            if [ -f "$dir/coverage/coverage-final.json" ]; then
              cp "$dir/coverage/coverage-final.json" "coverage/coverage-$(basename $dir).json"
            fi
          done

          if [ ! -s "coverage/lcov.info" ]; then
            echo "⚠️ No coverage data found - tests may not have generated coverage"
          else
            echo "✅ Coverage reports merged successfully"
          fi

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
            packages/*/coverage/
          retention-days: 30

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - design-system
          - 00_dashboard
          - 01_auth-profile
          - 02_projects
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.package }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/${{ matrix.package }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sonarqube:
    name: SonarQube Quality Gate (MANDATORY)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Check SONAR_TOKEN
        id: check-token
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️ SONAR_TOKEN not configured. Skipping SonarQube scan."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check-token.outputs.has_token == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.check-token.outputs.has_token == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install
        if: steps.check-token.outputs.has_token == 'true'

      - name: Download coverage reports
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: coverage
        continue-on-error: true

      - name: SonarQube Scan - A- Grade Minimum
        if: steps.check-token.outputs.has_token == 'true'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=oute-mind
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION || 'renatobardi' }}
            -Dsonar.sources=packages,shared
            -Dsonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts,**/dist/**,**/build/**
            -Dsonar.qualitygate.wait=true

  summary:
    name: PR Status Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, docker-build, sonarqube]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi

          # SonarQube check
          if [ "${{ needs.sonarqube.result }}" == "failure" ]; then
            echo "❌ SonarQube quality gate failed"
            exit 1
          fi

          if [ "${{ needs.sonarqube.result }}" == "skipped" ]; then
            echo "⚠️ SonarQube skipped - SONAR_TOKEN not configured. Set it up in GitHub Secrets."
          else
            echo "✅ SonarQube passed"
          fi

          echo "✅ All checks passed"
