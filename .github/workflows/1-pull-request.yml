name: Pull Request Checks

on:
  pull_request:
    branches: [develop, staging, main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: ESLint check
        run: npm run lint
        continue-on-error: false

      - name: Prettier check
        run: npm run format -- --check
        continue-on-error: false

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: TypeScript check per workspace
        run: |
          for dir in packages/design-system packages/00_dashboard packages/01_auth-profile packages/02_projects; do
            if [ -f "$dir/tsconfig.json" ]; then
              echo "Checking $dir..."
              npx tsc --noEmit --project "$dir/tsconfig.json" || true
            fi
          done
        continue-on-error: false

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: Run tests with coverage per package
        run: |
          for dir in packages/design-system packages/00_dashboard packages/01_auth-profile packages/02_projects; do
            if [ -f "$dir/vitest.config.ts" ]; then
              echo "🧪 Running tests in $dir..."
              npx vitest run --coverage --root "$dir" || exit 1
            fi
          done

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          for dir in packages/design-system packages/00_dashboard packages/01_auth-profile packages/02_projects; do
            if [ -f "$dir/coverage/lcov.info" ]; then
              echo "📊 Found coverage in $dir"
              cat "$dir/coverage/lcov.info" >> coverage/lcov.info
            fi
            if [ -f "$dir/coverage/coverage-final.json" ]; then
              cp "$dir/coverage/coverage-final.json" "coverage/coverage-$(basename $dir).json"
            fi
          done

          if [ ! -s "coverage/lcov.info" ]; then
            echo "⚠️ No coverage data found - tests may not have generated coverage"
          else
            echo "✅ Coverage reports merged successfully"
          fi

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
            packages/*/coverage/
          retention-days: 30

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - design-system
          - 00_dashboard
          - 01_auth-profile
          - 02_projects
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.package }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/${{ matrix.package }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # SonarCloud analysis is handled by the automatic SonarCloud GitHub integration.
  # Quality gate results appear as the "SonarCloud Code Analysis" check on PRs.

  summary:
    name: PR Status Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, docker-build]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi

          echo "✅ All checks passed"
