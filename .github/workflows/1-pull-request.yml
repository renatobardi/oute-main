name: Pull Request Checks

on:
  pull_request:
    branches: [develop, staging, main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: ESLint check
        run: npm run lint
        continue-on-error: false

      - name: Prettier check
        run: npm run format -- --check
        continue-on-error: false

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: Type check all packages
        run: |
          for pkg in packages/00_dashboard packages/01_auth-profile packages/02_projects packages/design-system; do
            echo "--- Type-checking $pkg ---"
            (cd "$pkg" && npx svelte-check --tsconfig ./tsconfig.json)
          done
        continue-on-error: false

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: Run tests with coverage
        run: npm run test -- --run --coverage
        continue-on-error: false



  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - design-system
          - 00_dashboard
          - 01_auth-profile
          - 02_projects
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.package }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/${{ matrix.package }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sonarqube:
    name: SonarQube Quality Gate (MANDATORY)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: SonarQube Scan - A- Grade Minimum
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=oute-main
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION || 'oute-main' }}
            -Dsonar.sources=packages,shared
            -Dsonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts,**/dist/**,**/build/**
            -Dsonar.qualitygate.wait=true

      - name: Verify Quality Gate Passed
        if: always()
        run: |
          echo "✅ SonarQube scan completed"
          echo "Required grade: A- (minimum)"
          echo "Coverage threshold: 80% (from Phase 5)"
          echo "This check is MANDATORY and blocks PR merge if failed"

  summary:
    name: PR Status Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, docker-build, sonarqube]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi

          # SonarQube is REQUIRED (not optional)
          if [ "${{ needs.sonarqube.result }}" == "failure" ]; then
            echo "❌ SonarQube quality gate failed"
            exit 1
          fi

          if [ "${{ needs.sonarqube.result }}" == "skipped" ]; then
            echo "❌ SonarQube skipped - SONAR_TOKEN is required and must be configured"
            exit 1
          fi

          echo "✅ SonarQube passed"
          echo "✅ All checks passed"
