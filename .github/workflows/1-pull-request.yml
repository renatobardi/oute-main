name: Pull Request Checks

on:
  pull_request:
    branches: [develop, staging, main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: ESLint check
        run: npm run lint
        continue-on-error: false

      - name: Prettier check
        run: npm run format -- --check
        continue-on-error: false

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: TypeScript check per workspace
        run: |
          for dir in packages/design-system packages/00_dashboard packages/01_auth-profile packages/02_projects packages/03_interview packages/97_admin packages/98_oops packages/99_home; do
            if [ -f "$dir/tsconfig.json" ]; then
              echo "Checking $dir..."
              npx tsc --noEmit --project "$dir/tsconfig.json" || true
            fi
          done
        continue-on-error: false

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: Run tests with coverage per package
        run: |
          for dir in packages/design-system packages/00_dashboard packages/01_auth-profile packages/02_projects packages/03_interview packages/97_admin packages/98_oops packages/99_home; do
            if [ -f "$dir/vitest.config.ts" ]; then
              echo "🧪 Running tests in $dir..."
              npx vitest run --coverage --root "$dir" || exit 1
            fi
          done

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          for dir in packages/design-system packages/00_dashboard packages/01_auth-profile packages/02_projects packages/03_interview packages/97_admin packages/98_oops packages/99_home; do
            if [ -f "$dir/coverage/lcov.info" ]; then
              echo "📊 Found coverage in $dir"
              cat "$dir/coverage/lcov.info" >> coverage/lcov.info
            fi
            if [ -f "$dir/coverage/coverage-final.json" ]; then
              cp "$dir/coverage/coverage-final.json" "coverage/coverage-$(basename $dir).json"
            fi
          done

          if [ ! -s "coverage/lcov.info" ]; then
            echo "⚠️ No coverage data found - tests may not have generated coverage"
          else
            echo "✅ Coverage reports merged successfully"
          fi

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
            packages/*/coverage/
          retention-days: 30

  design-system-check:
    name: Design System Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all SvelteKit packages use the design system
        run: |
          SVELTE_PACKAGES="packages/00_dashboard packages/01_auth-profile packages/02_projects packages/03_interview packages/97_admin packages/98_oops packages/99_home"
          FAILED=0

          for pkg in $SVELTE_PACKAGES; do
            name=$(basename "$pkg")

            # Must have src/app.css
            if [ ! -f "$pkg/src/app.css" ]; then
              echo "❌ $name: missing src/app.css"
              FAILED=1
              continue
            fi

            # src/app.css must import the design system
            if ! grep -q "design-system/src/theme/theme.css" "$pkg/src/app.css"; then
              echo "❌ $name: src/app.css does not import design-system theme"
              echo "   Expected: @import '../../design-system/src/theme/theme.css';"
              echo "   Found:"
              cat "$pkg/src/app.css"
              FAILED=1
              continue
            fi

            # Dockerfile must COPY the design-system in builder stage
            if [ -f "$pkg/Dockerfile" ]; then
              if ! grep -q "design-system" "$pkg/Dockerfile"; then
                echo "❌ $name: Dockerfile does not COPY packages/design-system"
                FAILED=1
                continue
              fi
            fi

            echo "✅ $name: compliant"
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "💡 To fix: ensure each SvelteKit package has:"
            echo "   1. src/app.css with: @import '../../design-system/src/theme/theme.css';"
            echo "   2. src/routes/+layout.svelte importing ../app.css"
            echo "   3. Dockerfile with: COPY packages/design-system ./packages/design-system"
            exit 1
          fi

          echo ""
          echo "✅ All SvelteKit packages are using the design system"

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - design-system
          - 00_dashboard
          - 01_auth-profile
          - 02_projects
          - 03_interview
          - 97_admin
          - 98_oops
          - 99_home
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.package }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/${{ matrix.package }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # SonarCloud analysis is handled by the automatic SonarCloud GitHub integration.
  # Quality gate results appear as the "SonarCloud Code Analysis" check on PRs.

  summary:
    name: PR Status Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, docker-build, design-system-check]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ] || \
             [ "${{ needs.design-system-check.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi

          echo "✅ All checks passed"
