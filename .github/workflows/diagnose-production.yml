name: Diagnose Production Issues

on:
  workflow_dispatch:
    inputs:
      full_debug:
        description: 'Run full debug with more detailed logs'
        required: false
        default: 'false'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VM_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Run diagnostics on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOSTNAME }} << 'EOFVM'
            cd ~/oute-mind

            echo "🔍 OUTE Production Diagnostics"
            echo "=============================="
            echo ""

            echo "📦 Docker Containers Status:"
            echo "============================="
            docker compose ps
            echo ""

            echo "🏠 99_home status:"
            docker compose ps 99_home 2>&1 || echo "❌ Service not found in docker-compose.yml"
            echo ""

            echo "💬 03_interview status:"
            docker compose ps 03_interview 2>&1 || echo "❌ Service not found in docker-compose.yml"
            echo ""

            echo "🧪 Testing Direct Endpoints:"
            echo "============================="

            echo "Testing 99_home (port 3003)..."
            if curl -sf http://localhost:3003/health > /dev/null 2>&1; then
              echo "✅ 99_home is healthy"
              echo "Response (first 200 chars):"
              curl -s http://localhost:3003/ | head -c 200
              echo ""
            else
              echo "❌ 99_home NOT responding - checking docker logs"
              docker compose logs --tail=10 99_home 2>&1 || echo "No logs available"
            fi
            echo ""

            echo "Testing 03_interview (port 3002)..."
            if curl -sf http://localhost:3002/health > /dev/null 2>&1; then
              echo "✅ 03_interview is healthy"
            else
              echo "❌ 03_interview NOT responding - checking docker logs"
              docker compose logs --tail=10 03_interview 2>&1 || echo "No logs available"
            fi
            echo ""

            echo "🔄 Caddy Reverse Proxy Status:"
            echo "=============================="
            docker compose ps caddy
            echo ""

            echo "Caddy logs (last 30 lines):"
            docker compose logs --tail=30 caddy 2>&1 || echo "No Caddy service"
            echo ""

            echo "📝 Caddyfile Configuration:"
            echo "=========================="

            if [ -f "Caddyfile" ]; then
              echo "✅ Caddyfile exists"
              echo ""
              echo "Root routing configuration:"
              grep -A 10 "@root" Caddyfile || echo "⚠️  No @root pattern found - need to run update-caddyfile.sh"
              echo ""
            else
              echo "❌ Caddyfile not found!"
            fi
            echo ""

            echo "🌐 Testing via Caddy (Port 80):"
            echo "================================"

            echo "GET http://localhost:80/"
            RESPONSE=$(curl -s http://localhost:80/ 2>&1 | head -c 500)
            echo "$RESPONSE"
            echo ""
            echo "---"
            if echo "$RESPONSE" | grep -q "Software Estimator\|API"; then
              echo "⚠️  PROBLEM: Still getting API response at root"
              echo "Solution: Run update-caddyfile.sh to configure Caddy routing"
            else
              echo "✅ Root is returning expected content"
            fi
            echo ""

            echo "📊 Disk Space:"
            df -h | head -5
            echo ""

            echo "💾 Memory Usage:"
            free -h | head -2

          EOFVM

      - name: Diagnose result
        if: success()
        run: |
          echo "✅ Diagnostics completed successfully"
          echo "Check the logs above for details"

      - name: Diagnose failed
        if: failure()
        run: |
          echo "❌ Diagnostics failed - SSH connection issue"
          exit 1
