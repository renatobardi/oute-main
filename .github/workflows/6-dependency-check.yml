name: Dependency & License Check

on:
  pull_request:
    paths: ['package*.json']
  schedule:
    # Check weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'OUTE'
          path: '.'
          format: 'SARIF'
          args: >
            --enableExperimental
            --enableRetired

      - name: Upload Dependency Check results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'reports/dependency-check-report.sarif'

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        id: audit
        run: |
          npm audit --json > audit-results.json || true
          cat audit-results.json

      - name: Check npm audit for HIGH/CRITICAL vulnerabilities
        run: |
          AUDIT_RESULT=$(cat audit-results.json)

          # Known dev-only vulnerabilities that are acceptable (Storybook v7 transitive deps)
          KNOWN_DEV_VULNS="@storybook/cli giget tar"

          CRITICAL_COUNT=$(echo $AUDIT_RESULT | jq '[.vulnerabilities[] | select(.severity == "critical")] | length')
          HIGH_COUNT=$(echo $AUDIT_RESULT | jq '[.vulnerabilities[] | select(.severity == "high")] | length')

          # Filter out known dev-only vulnerabilities
          FILTERED_HIGH=$(echo $AUDIT_RESULT | jq --arg known "$KNOWN_DEV_VULNS" '
            [.vulnerabilities | to_entries[] |
              select(.value.severity == "high") |
              select(($known | split(" ") | map(. == .key) | any) | not) |
              .key
            ] | length
          ')
          FILTERED_CRITICAL=$(echo $AUDIT_RESULT | jq '[.vulnerabilities[] | select(.severity == "critical")] | length')

          echo "🔍 Vulnerability Report:"
          echo "  - CRITICAL: $CRITICAL_COUNT"
          echo "  - HIGH: $HIGH_COUNT (filtered: $FILTERED_HIGH after excluding known dev-only deps)"

          if [ "$FILTERED_CRITICAL" -gt 0 ] || [ "$FILTERED_HIGH" -gt 0 ]; then
            echo ""
            echo "❌ Found actionable HIGH/CRITICAL vulnerabilities"
            echo "❌ PR is blocked due to security issues"
            exit 1
          fi

          if [ "$HIGH_COUNT" -gt "$FILTERED_HIGH" ]; then
            echo "⚠️  $(( HIGH_COUNT - FILTERED_HIGH )) HIGH vulnerabilities in known dev-only deps (Storybook v7) - tracked for upgrade"
          fi

          echo "✅ No actionable HIGH/CRITICAL vulnerabilities found"

      - name: Comment PR with audit results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));

            if (audit.vulnerabilities && Object.keys(audit.vulnerabilities).length > 0) {
              const critical = Object.values(audit.vulnerabilities).filter(v => v.severity === 'critical').length;
              const high = Object.values(audit.vulnerabilities).filter(v => v.severity === 'high').length;
              const moderate = Object.values(audit.vulnerabilities).filter(v => v.severity === 'moderate').length;
              const low = Object.values(audit.vulnerabilities).filter(v => v.severity === 'low').length;

              const comment = `## 📦 NPM Audit Results\n\n- **Critical**: ${critical} ❌\n- **High**: ${high} ❌\n- **Moderate**: ${moderate} ⚠️\n- **Low**: ${low} ℹ️\n\n${critical > 0 || high > 0 ? '**⚠️ PR BLOCKED**: Found HIGH/CRITICAL vulnerabilities. Run \`npm audit fix\` locally to resolve.\n\n' : ''}Run \`npm audit\` locally for more details.`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          license-checker \
            --production \
            --onlyAllow "MIT,Apache-2.0,BSD,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0" \
            --markdown > LICENSE_REPORT.md || echo "License check completed with warnings"

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: LICENSE_REPORT.md

  dependabot-auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Approve and merge Dependabot PR
        run: |
          echo "Dependabot PR detected. Manual review recommended before merge."
          # Auto-merge only minor and patch updates
          if [[ "${{ github.event.pull_request.title }}" =~ (bump|chore.*dependencies) ]]; then
            echo "⚠️ Review and merge manually for security updates"
          fi

  notify:
    name: Notify Dependency Check
    runs-on: ubuntu-latest
    needs: [npm-audit, license-check]
    if: always()
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Dependency & license check completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
