# Production compose — oute-main
# Roda isolado do oute-main. Conecta à rede do oute-mind para o Caddy rotear por container name.
# Pré-condição: oute-mind deve estar rodando (cria oute-mind_oute-network).
# Uso: docker compose -f docker-compose.prod.yml up -d

services:
  oute-main-postgres:
    image: postgres:15-alpine
    container_name: oute-main-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: oute_main
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app-user} -d oute_main"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oute-mind-network
    restart: unless-stopped

  00_dashboard:
    build:
      context: .
      dockerfile: packages/00_dashboard/Dockerfile
    container_name: oute-dashboard
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app-user}:${POSTGRES_PASSWORD}@oute-main-postgres:5432/oute_main
      - AUTH_SERVICE_URL=http://oute-auth-profile:3001
      - PROJECTS_SERVICE_URL=http://oute-projects:3005
    depends_on:
      oute-main-postgres:
        condition: service_healthy
    networks:
      - oute-mind-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/dashboard/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  01_auth-profile:
    build:
      context: .
      dockerfile: packages/01_auth-profile/Dockerfile
    container_name: oute-auth-profile
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app-user}:${POSTGRES_PASSWORD}@oute-main-postgres:5432/oute_main
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      oute-main-postgres:
        condition: service_healthy
    networks:
      - oute-mind-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/auth/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  02_projects:
    build:
      context: .
      dockerfile: packages/02_projects/Dockerfile
    container_name: oute-projects
    expose:
      - "3005"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app-user}:${POSTGRES_PASSWORD}@oute-main-postgres:5432/oute_main
      - AUTH_SERVICE_URL=http://oute-auth-profile:3001
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      oute-main-postgres:
        condition: service_healthy
    networks:
      - oute-mind-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3005/projects/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  03_interview:
    build:
      context: .
      dockerfile: packages/03_interview/Dockerfile
    container_name: oute-interview
    expose:
      - "3002"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app-user}:${POSTGRES_PASSWORD}@oute-main-postgres:5432/oute_main
      - VITE_AUTH_SERVICE_URL=${VITE_AUTH_SERVICE_URL:-http://34.132.93.171}
      - VITE_API_TIMEOUT=30000
    depends_on:
      oute-main-postgres:
        condition: service_healthy
    networks:
      - oute-mind-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/chat/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  99_home:
    build:
      context: .
      dockerfile: packages/99_home/Dockerfile
    container_name: oute-home
    expose:
      - "3003"
    environment:
      - NODE_ENV=production
      - VITE_AUTH_SERVICE_URL=${VITE_AUTH_SERVICE_URL:-http://34.132.93.171}
      - VITE_API_TIMEOUT=30000
    networks:
      - oute-mind-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  98_oops:
    build:
      context: .
      dockerfile: packages/98_oops/Dockerfile
    container_name: oute-oops
    expose:
      - "3004"
    environment:
      - NODE_ENV=production
    networks:
      - oute-mind-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres-data:
    driver: local

networks:
  oute-mind-network:
    external: true
    name: oute-mind_oute-network
